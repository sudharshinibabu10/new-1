<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyBuddy Chat</title>
<style>
  :root {
    --bg-dark: #0f172a;
    --bg-panel: #111827;
    --accent: #6366f1;
    --accent-light: #818cf8;
    --bubble-bot: #1e293b;
    --bubble-user: #4338ca;
    --text-light: #e2e8f0;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top left, #1e293b, var(--bg-dark) 70%);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    padding: 20px;
  }

  .chat-shell {
    width: 100%;
    max-width: 560px;
    background: var(--bg-panel);
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 80vh;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }

  .chat-header {
    padding: 18px 22px;
    background: linear-gradient(135deg, var(--accent), #4338ca);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .chat-header .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .chat-header h1 {
    font-size: 16px;
    margin: 0;
    color: white;
  }

  .chat-header p {
    margin: 0;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.8);
  }

  .messages {
    flex: 1;
    padding: 18px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    color: var(--text-light);
    border-bottom-left-radius: 4px;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .msg.typing {
    align-self: flex-start;
    background: var(--bubble-bot);
    color: var(--text-muted);
    font-style: italic;
  }

  .input-bar {
    display: flex;
    gap: 10px;
    padding: 14px;
    background: #0d1424;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }

  .input-bar input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: #1a2338;
    color: var(--text-light);
    font-size: 14px;
    outline: none;
  }

  .input-bar input:focus {
    border-color: var(--accent-light);
  }

  .input-bar button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .input-bar button:hover {
    background: var(--accent-light);
  }

  .input-bar button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .messages::-webkit-scrollbar {
    width: 6px;
  }

  .messages::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 4px;
  }
</style>
</head>
<body>

<div class="chat-shell">
  <div class="chat-header">
    <div class="avatar">🎓</div>
    <div>
      <h1>StudyBuddy</h1>
      <p>Your focused study assistant</p>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg bot">Hi! I'm StudyBuddy. Ask me anything about your studies and I'll do my best to help.</div>
  </div>

  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Ask a study question..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;

    const typingEl = addMessage("Thinking...", "typing");

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      typingEl.remove();
      addMessage(data.reply || "No response received.", "bot");
    } catch (err) {
      typingEl.remove();
      addMessage("Network error. Please try again.", "bot");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
